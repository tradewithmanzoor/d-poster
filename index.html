<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D Poster Studio</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#f2f3f8;color:#24243b}button,input,select{font:inherit}button{border:1px solid #ddd9f4;background:white;border-radius:9px;padding:10px;cursor:pointer;color:#382e76}button:active{background:#e9e4ff}.primary{background:#7048e8;color:white}.bar{background:white;display:flex;align-items:center;gap:9px;padding:11px;flex-wrap:wrap;border-bottom:1px solid #ddd}.logo{font-weight:900;font-size:22px;color:#7048e8;margin-right:auto}.app{display:grid;grid-template-columns:245px minmax(0,1fr) 235px;gap:12px;padding:12px;min-height:85vh}.pane{background:white;border-radius:13px;padding:14px;min-width:0;box-shadow:0 1px 5px #ddd}.pane h3{margin:6px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{min-height:53px}.work{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto;gap:10px;background:#e9eaf2;border-radius:13px;padding:20px}.canvas{position:relative;width:min(100%,540px);aspect-ratio:1/1;background:white;box-shadow:0 8px 30px #0002;overflow:hidden;touch-action:none}.item{position:absolute;white-space:pre-wrap;overflow:hidden;touch-action:none;user-select:none;cursor:move}.item.selected{outline:2px dashed #7048e8;outline-offset:2px}.item img{width:100%;height:100%;object-fit:contain;pointer-events:none}.field{display:block;margin:12px 0 4px;font-weight:600}.pane input,.pane select{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px}.template{color:white;background:linear-gradient(125deg,#673ee9,#ed659f);font-weight:800}.muted{color:#666;font-size:12px}.hidden{display:none!important}@media(max-width:850px){.app{grid-template-columns:1fr}.pane{padding:12px}.work{min-height:380px;padding:12px}.canvas{width:min(100%,450px)}.grid{grid-template-columns:repeat(3,1fr)}} </style></head><body>
<header class="bar"><div class="logo">D Poster ✦</div><button id="new">New</button><button id="undo">↶ Undo</button><button id="redo">↷ Redo</button><button id="save">Save</button><button id="open">Open</button><button class="primary" id="download">Download PNG</button></header>
<div class="app"><aside class="pane"><h3>Design tools</h3><input id="search" placeholder="Search templates"><p class="muted">Choose a template</p><div class="grid" id="templates"></div><h3>Add elements</h3><div class="grid"><button id="addText">＋ Text</button><button id="addShape">▢ Shape</button><button id="addCircle">◯ Circle</button><button id="addPhoto">＋ Photo</button></div><input type="file" id="file" accept="image/*" class="hidden"><label class="field">Poster size</label><select id="size"><option value="1">Square 1:1</option><option value=".8">Portrait 4:5</option><option value=".5625">Story 9:16</option><option value="1.7778">Landscape 16:9</option></select><label class="field">Background</label><input type="color" id="bg" value="#ffffff"><button id="clear" style="margin-top:12px">Clear design</button></aside>
<main class="work"><div id="canvas" class="canvas"></div><div class="muted" id="status">Tap an element to edit; drag to move.</div></main>
<aside class="pane"><h3>Element settings</h3><div id="empty">Select a text, shape, or photo on the poster.</div><div id="editor" class="hidden"><label class="field">Text</label><input id="text" placeholder="Your text"><label class="field">Font size</label><input type="range" id="font" min="12" max="110"><label class="field">Color</label><input type="color" id="color"><label class="field">Width (%)</label><input type="range" id="width" min="10" max="100"><label class="field">Height (%)</label><input type="range" id="height" min="5" max="100"><label class="field">Alignment</label><select id="align"><option>left</option><option>center</option><option>right</option></select><div class="grid" style="margin-top:14px"><button id="front">Bring front</button><button id="back">Send back</button><button id="duplicate">Duplicate</button><button id="remove">Delete</button></div></div><p class="muted">Projects are saved on this device. Images stay in your browser.</p></aside></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('canvas');let state={bg:'#ffffff',ratio:1,items:[]},selected=null,history=[],future=[];const clone=o=>JSON.parse(JSON.stringify(o));const uid=()=>Math.random().toString(36).slice(2);function snap(){history.push(clone(state));if(history.length>60)history.shift();future=[]}function item(type,extra={}){snap();let e={id:uid(),type,x:16,y:25,w:68,h:18,text:'Your headline',font:40,color:'#24243b',align:'center',...extra};state.items.push(e);selected=e.id;render()}function current(){return state.items.find(e=>e.id===selected)}function render(){cv.style.background=state.bg;cv.style.aspectRatio=state.ratio;cv.replaceChildren();state.items.forEach(e=>{let d=document.createElement('div');d.className='item'+(selected===e.id?' selected':'');d.style.cssText='left:'+e.x+'%;top:'+e.y+'%;width:'+e.w+'%;height:'+e.h+'%;color:'+e.color+';font-size:clamp(8px,'+(e.font/540*100)+'cqw,90px);text-align:'+e.align+';display:flex;align-items:center;justify-content:'+(e.align==='left'?'flex-start':e.align==='right'?'flex-end':'center')+';'+(e.type!=='text'?'background:'+ (e.type==='photo'?'transparent':e.color)+';':'');if(e.type==='circle')d.style.borderRadius='50%';if(e.type==='photo'){let im=document.createElement('img');im.src=e.src;d.append(im)}else if(e.type==='text')d.textContent=e.text;d.addEventListener('pointerdown',ev=>{ev.preventDefault();selected=e.id;let rect=cv.getBoundingClientRect(),sx=ev.clientX,sy=ev.clientY,ox=e.x,oy=e.y,moved=false;d.setPointerCapture(ev.pointerId);function move(v){if(!moved){snap();moved=true}e.x=Math.max(0,Math.min(100-e.w,ox+(v.clientX-sx)/rect.width*100));e.y=Math.max(0,Math.min(100-e.h,oy+(v.clientY-sy)/rect.height*100));d.style.left=e.x+'%';d.style.top=e.y+'%'}d.onpointermove=move;d.onpointerup=()=>{d.onpointermove=null;render()};sync()});cv.append(d)});sync()}function sync(){let e=current();$('empty').classList.toggle('hidden',!!e);$('editor').classList.toggle('hidden',!e);if(!e)return;$('text').disabled=e.type!=='text';$('font').disabled=e.type!=='text';$('align').disabled=e.type!=='text';$('text').value=e.text||'';$('font').value=e.font;$('color').value=e.color;$('width').value=e.w;$('height').value=e.h;$('align').value=e.align}function change(fn){snap();fn();render()}$('addText').onclick=()=>item('text');$('addShape').onclick=()=>item('shape',{w:40,h:20,color:'#7048e8'});$('addCircle').onclick=()=>item('circle',{w:28,h:28,color:'#ffac33'});$('addPhoto').onclick=()=>$('file').click();$('file').onchange=ev=>{let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>item('photo',{src:r.result,w:65,h:55});r.readAsDataURL(f);ev.target.value=''};for(let [id,key,parse] of [['text','text',String],['font','font',Number],['color','color',String],['width','w',Number],['height','h',Number],['align','align',String]])$(''+id).onchange=ev=>{let e=current();if(e)change(()=>e[key]=parse(ev.target.value))};$('bg').oninput=e=>change(()=>state.bg=e.target.value);$('size').onchange=e=>change(()=>state.ratio=Number(e.target.value));$('remove').onclick=()=>{if(current())change(()=>{state.items=state.items.filter(e=>e.id!==selected);selected=null})};$('duplicate').onclick=()=>{let e=current();if(e)item(e.type,{...clone(e),id:uid(),x:Math.min(80,e.x+5),y:Math.min(80,e.y+5)})};$('front').onclick=()=>change(()=>{let i=state.items.findIndex(e=>e.id===selected);if(i>=0)state.items.push(...state.items.splice(i,1))});$('back').onclick=()=>change(()=>{let i=state.items.findIndex(e=>e.id===selected);if(i>=0)state.items.unshift(...state.items.splice(i,1))});$('undo').onclick=()=>{if(history.length){future.push(clone(state));state=history.pop();selected=null;render()}};$('redo').onclick=()=>{if(future.length){history.push(clone(state));state=future.pop();selected=null;render()}};$('new').onclick=()=>{if(confirm('Start a new design?'))change(()=>{state={bg:'#ffffff',ratio:1,items:[]};selected=null})};$('clear').onclick=()=>{if(confirm('Clear all elements?'))change(()=>{state.items=[];selected=null})};$('save').onclick=()=>{try{localStorage.setItem('dposter-project',JSON.stringify(state));$('status').textContent='Saved on this device'}catch(e){alert('Storage full: try smaller photos')}};$('open').onclick=()=>{let s=localStorage.getItem('dposter-project');if(!s)return alert('No saved design found');try{state=JSON.parse(s);selected=null;history=[];future=[];render()}catch(e){alert('Could not open project')}};const presets=[['Mega Sale','#401b85','#ffcf37'],['Business','#103c5b','#a8e9fa'],['Birthday','#d63486','#ffe89e'],['Restaurant','#77321b','#f9d16b'],['Travel','#146c76','#ffffff'],['Event','#252347','#c5b3ff'],['Fitness','#15241c','#a6fa55'],['Education','#214b92','#ffffff'],['Fashion','#702c53','#ffd0e3'],['Technology','#101c44','#79f4ef'],['Wedding','#7d5565','#fff2d8'],['Motivation','#344b34','#f2eecb']];function loadPreset(p){change(()=>{state.bg=p[1];state.items=[{id:uid(),type:'text',x:8,y:20,w:84,h:25,text:p[0].toUpperCase(),font:64,color:p[2],align:'center'},{id:uid(),type:'text',x:12,y:52,w:76,h:15,text:'Customize your design',font:26,color:'#ffffff',align:'center'}];selected=null})}function templates(q=''){$('templates').replaceChildren();presets.filter(p=>p[0].toLowerCase().includes(q.toLowerCase())).forEach(p=>{let b=document.createElement('button');b.className='template';b.style.background='linear-gradient(135deg,'+p[1]+','+p[2]+')';b.textContent=p[0];b.onclick=()=>loadPreset(p);$('templates').append(b)})}$('search').oninput=e=>templates(e.target.value);
$('download').onclick=async()=>{let w=1080,h=Math.round(w/state.ratio),c=document.createElement('canvas');c.width=w;c.height=h;let g=c.getContext('2d');g.fillStyle=state.bg;g.fillRect(0,0,w,h);for(let e of state.items){let x=e.x/100*w,y=e.y/100*h,ew=e.w/100*w,eh=e.h/100*h;if(e.type==='shape'||e.type==='circle'){g.fillStyle=e.color;g.beginPath();if(e.type==='circle')g.ellipse(x+ew/2,y+eh/2,ew/2,eh/2,0,0,Math.PI*2);else g.rect(x,y,ew,eh);g.fill()}else if(e.type==='photo'){let im=new Image();im.src=e.src;try{await im.decode();let scale=Math.min(ew/im.width,eh/im.height),iw=im.width*scale,ih=im.height*scale;g.drawImage(im,x+(ew-iw)/2,y+(eh-ih)/2,iw,ih)}catch(err){}}else{g.fillStyle=e.color;g.font='bold '+(e.font*2)+'px system-ui';g.textAlign=e.align;g.textBaseline='middle';let tx=e.align==='left'?x:e.align==='right'?x+ew:x+ew/2;let lines=e.text.split('\n');lines.forEach((line,i)=>g.fillText(line,tx,y+eh/2+(i-(lines.length-1)/2)*e.font*2,ew))}}let a=document.createElement('a');a.download='D-Poster.png';a.href=c.toDataURL('image/png');a.click();$('status').textContent='PNG exported'};templates();loadPreset(presets[0]);})();
</script></body></html>
