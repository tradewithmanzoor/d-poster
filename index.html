<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D Poster</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ff;color:#25223a;font-family:system-ui,Arial}header{background:#fff;padding:18px 5%;font-weight:800;font-size:24px;color:#5638dc}main{max-width:1100px;margin:25px auto;padding:15px;display:grid;grid-template-columns:340px 1fr;gap:20px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px #2221}h2{margin-top:0}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;font:inherit}button{background:#603def;color:white;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;margin-top:15px}.poster{width:min(100%,500px);aspect-ratio:1;background:linear-gradient(135deg,#6139da,#201742);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:35px;margin:auto;overflow:hidden}.poster h1{font-size:clamp(28px,6vw,55px);line-height:1.05;overflow-wrap:anywhere}.poster strong{background:#fff;color:#3d2689;padding:10px 24px;border-radius:30px;font-size:25px}.poster img{max-width:65%;max-height:35%;object-fit:contain;display:none}.poster p{overflow-wrap:anywhere}@media(max-width:740px){main{grid-template-columns:1fr}}</style></head><body><header>✦ D Poster</header><main><section class="card"><h2>Make your poster</h2><label>Template</label><select id="template"><option value="#6139da">Mega Sale</option><option value="#b72e38">Restaurant Deal</option><option value="#aa3c83">Beauty Salon</option><option value="#15718a">Travel Offer</option><option value="#24674b">Property Listing</option></select><label>Business name</label><input id="business" value="YOUR BUSINESS"><label>Headline</label><input id="headline" value="MEGA SALE"><label>Offer</label><input id="offer" value="50% OFF"><label>Contact</label><input id="contact" value="0300-1234567"><label>Product photo</label><input type="file" accept="image/*" id="upload"><button id="download">Download PNG</button></section><section class="card"><h2>Live preview</h2><div class="poster" id="poster"><p id="b"></p><h1 id="h"></h1><img id="photo"><strong id="o"></strong><p id="c"></p></div></section></main><script>
const $=x=>document.getElementById(x);function update(){for(const [a,b] of [['business','b'],['headline','h'],['offer','o'],['contact','c']])$(b).textContent=$(a).value;$('poster').style.background='linear-gradient(135deg,'+$('template').value+',#201742)'}['business','headline','offer','contact','template'].forEach(x=>$(x).addEventListener('input',update));$('upload').onchange=e=>{const f=e.target.files[0];if(!f||!f.type.startsWith('image/'))return;const r=new FileReader;r.onload=()=>{$('photo').src=r.result;$('photo').style.display='block'};r.readAsDataURL(f)};
$('download').onclick=()=>{const cv=document.createElement('canvas');cv.width=cv.height=1080;const ctx=cv.getContext('2d');const g=ctx.createLinearGradient(0,0,1080,1080);g.addColorStop(0,$('template').value);g.addColorStop(1,'#201742');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1080);ctx.fillStyle='white';ctx.textAlign='center';const txt=(s,y,size)=>{ctx.font='bold '+size+'px system-ui';let line='',lines=[];for(const word of s.split(' ')){const n=(line+' '+word).trim();if(ctx.measureText(n).width>950&&line){lines.push(line);line=word}else line=n}lines.push(line);lines.slice(0,3).forEach((l,i)=>ctx.fillText(l,540,y+i*(size+10)))};txt($('business').value,170,43);txt($('headline').value,350,85);const im=$('photo');if(im.complete&&im.naturalWidth){const s=Math.min(450/im.naturalWidth,300/im.naturalHeight);ctx.drawImage(im,540-im.naturalWidth*s/2,460,im.naturalWidth*s,im.naturalHeight*s)}txt($('offer').value,850,67);txt($('contact').value,990,37);const a=document.createElement('a');a.download='d-poster.png';a.href=cv.toDataURL('image/png');a.click()};update();
</script></body></html>
